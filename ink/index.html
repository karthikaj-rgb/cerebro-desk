<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cerebro · Ink of Light</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Nanum+Pen+Script&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
    <link rel="stylesheet" href="desk.css" />
  </head>
  <body>
    <!-- The sky: slow aurora light and film grain behind everything -->
    <div class="sky" aria-hidden="true"><i class="a1"></i><i class="a2"></i><i class="a3"></i><b class="grain"></b></div>

    <header class="top">
      <div class="brand"><span class="mark"></span>Cerebro <em>Acme Agency · 1,284 sub-accounts</em></div>
      <div class="tools">
        <button class="tbtn" id="look" title="Switch between the Calm and Ink looks"><i class="ti ti-palette"></i> <span id="lookName">Calm</span></button>
        <button class="tbtn" id="resketch" title="Ask the AI to sketch the desk again"><i class="ti ti-scribble"></i> Re-sketch</button>
        <button class="tbtn icon" id="theme" title="Light / dark" aria-label="Switch light and dark"><i class="ti ti-sun-moon"></i></button>
      </div>
    </header>

    <main class="desk" id="desk" aria-label="Your desk">
      <section class="hello" id="hello">
        <div class="when">Mon · Nov 2 · 9:38 AM</div>
        <h1 id="hi">Good morning, Maya.</h1>
        <p class="hand" id="hiNote"><b>Three things need you.</b> They’re marked in red.</p>
        <p class="calm">Everything else is running.</p>
      </section>
      <svg class="threads" id="threads" aria-hidden="true"></svg>
    </main>

    <!-- Your own ink: the pen trail and anything you scribble -->
    <canvas class="ink" id="ink" aria-hidden="true"></canvas>
    <div class="pen" id="pen" aria-hidden="true"></div>

    <div class="lasso" id="lasso" hidden></div>

    <form class="bar" id="bar" autocomplete="off">
      <div class="bar-hint" id="barHint"><i class="ti ti-scribble"></i> Draw a circle around anything to talk about it together</div>
      <div class="bar-pill">
        <span class="spark">✦</span>
        <input id="ask" placeholder="Ask your desk anything…" />
        <button type="button" class="mic" id="mic" aria-label="Talk"><i class="ti ti-microphone"></i></button>
      </div>
    </form>

    <div class="toast" id="toast" hidden></div>
    <!-- The veil blurs the desk away behind a room (kept outside the portal: its clip-path would block the blur) -->
    <div class="veil" id="veil" aria-hidden="true"></div>
    <div class="portal" id="portal" hidden></div>

    <script type="module" src="desk.js"></script>
  </body>
</html>
