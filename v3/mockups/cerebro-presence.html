<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cerebro Presence</title>
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root { --bg:#f7f7f9; --side:#efeff3; --fg:#14151a; --fg2:#5b5d68; --fg3:#8c8e99; --line:rgba(20,21,26,.08); --raise:#fff; --raise2:rgba(255,255,255,.94); --chip:rgba(20,21,26,.06); --hover:rgba(20,21,26,.05); --ring:rgba(20,21,26,.09); --need:#f0973f; --needbg:rgba(240,151,63,.12); --needtx:#b4610f; --ok:#1f9d5c; --s:0 0 0 1px rgba(20,21,26,.06), 0 24px 50px -30px rgba(20,21,26,.3); --SB:272px; }
:root[data-theme='dark'] { --bg:#0a0a0d; --side:#0f0f13; --fg:#f1f1f5; --fg2:#a4a6b1; --fg3:#6c6f7b; --line:rgba(255,255,255,.07); --raise:#16171c; --raise2:rgba(22,23,28,.95); --chip:rgba(255,255,255,.07); --hover:rgba(255,255,255,.05); --ring:rgba(255,255,255,.08); --needbg:rgba(240,151,63,.14); --needtx:#ffb066; --s:0 0 0 1px rgba(255,255,255,.08), 0 24px 50px -24px rgba(0,0,0,.8); }
* { box-sizing:border-box; } html, body { margin:0; height:100%; }
body { background:var(--bg); color:var(--fg); font:400 15px/1.5 Inter, system-ui, sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; user-select:none; transition:background .3s; }
button { font:inherit; color:inherit; border:0; background:none; cursor:pointer; text-align:left; }
canvas.face { display:block; flex:none; }
kbd { font:500 10.5px Inter; opacity:.55; }

/* ── The sidebar: every place you already have ── */
.sb { position:fixed; left:0; top:0; bottom:0; width:var(--SB); background:var(--side); border-right:1px solid var(--line); display:flex; flex-direction:column; z-index:40; }
.sbh { display:flex; align-items:center; gap:10px; padding:18px 18px 12px; font-size:11.5px; font-weight:600; letter-spacing:.14em; }
.sbh .sp { flex:1; }
.tools { display:flex; gap:6px; padding:0 12px 8px; }
.tools button { flex:1; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; gap:8px; font-size:13.5px; color:var(--fg2); background:var(--chip); transition:color .15s, background .15s; }
.tools button:hover { color:var(--fg); }
.scroll { flex:1; overflow-y:auto; padding:4px 10px 10px; scrollbar-width:none; } .scroll::-webkit-scrollbar { display:none; }
.it { width:100%; display:flex; align-items:center; gap:10px; height:38px; padding:0 10px; border-radius:10px; font-size:14px; color:var(--fg2); transition:background .12s, color .12s; position:relative; }
.it:hover { background:var(--hover); color:var(--fg); } .it.on { background:var(--chip); color:var(--fg); }
.it .t { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .it small { font-size:12px; color:var(--fg3); font-variant-numeric:tabular-nums; }
.it .hash { width:20px; text-align:center; color:var(--fg3); flex:none; } .it .ic { width:20px; display:grid; place-items:center; flex:none; color:var(--fg3); }
.it .ic svg { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.it em { font-style:normal; font-size:11px; font-weight:600; min-width:20px; height:20px; padding:0 6px; border-radius:10px; background:var(--need); color:#1a1205; display:grid; place-items:center; }
.sec { font-size:10.5px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--fg3); padding:16px 10px 6px; display:flex; align-items:center; justify-content:space-between; }
.sec button { color:var(--fg3); font-size:16px; line-height:1; width:22px; height:22px; border-radius:6px; display:grid; place-items:center; } .sec button:hover { background:var(--hover); color:var(--fg); }
/* the jobs that need you sit right under Now, loud */
.nrow { width:100%; display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:12px; margin-top:4px; background:var(--needbg); box-shadow:inset 0 0 0 1px rgba(240,151,63,.25); transition:background .15s, box-shadow .15s; }
.nrow:hover { box-shadow:inset 0 0 0 1px rgba(240,151,63,.55); }
.nrow.on { background:var(--raise); box-shadow:inset 0 0 0 1.5px var(--need), 0 10px 24px -16px rgba(240,151,63,.7); }
.nrow .tx { flex:1; min-width:0; } .nrow b { display:block; font-weight:500; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .nrow small { display:block; font-size:12px; color:var(--fg3); }
.nrow .st { font-weight:600; color:var(--needtx); font-variant-numeric:tabular-nums; }
.nrow.done { background:none; box-shadow:none; } .nrow.done b { color:var(--fg3); } .nrow.done .st { color:var(--ok); }
.nrow.later { background:none; box-shadow:inset 0 0 0 1px var(--line); } .nrow.later .st { color:var(--fg3); font-weight:500; }
.nrow.start { background:none; box-shadow:none; } .nrow.start:hover { background:var(--hover); }
.team { display:grid; grid-template-columns:repeat(5, 1fr); gap:2px; padding:2px 0; }
.team button { display:flex; flex-direction:column; align-items:center; gap:4px; padding:7px 0 5px; border-radius:10px; font-size:10.5px; color:var(--fg2); position:relative; }
.team button:hover { background:var(--hover); } .team button.on { background:var(--chip); color:var(--fg); }
.team button i { position:absolute; top:4px; right:12px; width:8px; height:8px; border-radius:50%; background:var(--need); box-shadow:0 0 0 2px var(--side); }
.foot { border-top:1px solid var(--line); padding:8px 10px 12px; display:flex; flex-direction:column; gap:2px; }
.foot .rev { font-size:11px; font-weight:500; padding:2px 8px; border-radius:99px; background:var(--needbg); color:var(--needtx); }
.me { display:flex; align-items:center; gap:10px; padding:8px 10px; } .me .av { width:32px; height:32px; border-radius:50%; background:var(--fg); color:var(--bg); display:grid; place-items:center; font-size:11.5px; font-weight:600; }
.me b { display:block; font-weight:500; font-size:14px; } .me small { font-size:12px; color:var(--fg3); }

/* ── Main ── */
.main { position:fixed; left:var(--SB); right:0; top:0; bottom:0; }
.bar { position:absolute; left:0; right:0; top:0; height:64px; display:flex; align-items:center; gap:8px; padding:0 22px; z-index:30; }
.bar .sp { flex:1; }
.pill { height:34px; padding:0 14px; border-radius:17px; display:inline-flex; align-items:center; gap:8px; font-size:13px; color:var(--fg2); background:var(--chip); transition:background .15s, color .15s; }
.pill:hover { color:var(--fg); } .pill.on { background:var(--fg); color:var(--bg); }
.money b { color:var(--fg); font-weight:500; font-variant-numeric:tabular-nums; } .money i { width:7px; height:7px; border-radius:50%; background:var(--ok); }
.icon { width:34px; height:34px; border-radius:17px; display:grid; place-items:center; background:var(--chip); color:var(--fg2); } .icon:hover { color:var(--fg); }
.icon svg { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.date { font-size:13px; color:var(--fg3); }

/* What needs you, said plainly at the top */
.head { position:absolute; left:28px; top:64px; z-index:20; }
.head h1 { margin:0; font-weight:300; font-size:44px; letter-spacing:-.035em; line-height:1.05; }
.head h1 b { font-weight:400; color:var(--need); } .head h1 b.ok { color:var(--ok); }
.head p { margin:6px 0 0; font-size:15px; color:var(--fg2); } .head p b { color:var(--needtx); font-weight:500; }

/* The team in orbit around Cerebro: the closer, the more it needs you */
.stage { position:absolute; inset:0; z-index:5; }
.stage svg.rings { position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none; }
.stage svg.rings ellipse { fill:none; stroke:var(--ring); } .stage svg.rings ellipse.r1 { stroke:rgba(240,151,63,.55); stroke-dasharray:2 6; stroke-width:1.3; }
.stage svg.rings ellipse.g1 { fill:rgba(240,151,63,.05); stroke:none; }
.stage svg.rings path.tether { fill:none; stroke:var(--need); stroke-width:1.6; stroke-dasharray:3 6; animation:flow 1s linear infinite; opacity:.9; }
@keyframes flow { to { stroke-dashoffset:-18; } }
.ringlbl { position:absolute; z-index:0; transform:translate(-50%,-50%); font-size:9.5px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--fg3); padding:2px 8px; border-radius:99px; background:var(--bg); white-space:nowrap; pointer-events:none; }
.ringlbl.n { color:var(--needtx); }
.ag { position:absolute; left:0; top:0; display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer; will-change:transform; }
.ag .nm { font-size:11.5px; color:var(--fg); white-space:nowrap; padding:2px 9px; border-radius:99px; background:var(--raise2); box-shadow:0 0 0 1px var(--line); opacity:0; transform:translateY(-3px); transition:opacity .2s, transform .2s; }
.ag:hover .nm, .ag.need .nm, .ag.work .nm { opacity:1; transform:none; }
.ag.need .nm { background:var(--need); color:#1a1205; font-weight:600; box-shadow:none; }
.ag .fw { position:relative; }
.ag .prog { position:absolute; inset:-10%; width:120%; height:120%; transform:rotate(-90deg); opacity:0; transition:opacity .3s; pointer-events:none; }
.ag .prog circle { fill:none; stroke-width:2.5; } .ag .prog .bg { stroke:var(--line); } .ag .prog .fg { stroke:#8b90ff; stroke-linecap:round; }
.ag.work .prog { opacity:1; }
.ag .chk { position:absolute; bottom:0; right:-2px; width:18px; height:18px; border-radius:50%; background:var(--ok); color:#fff; display:grid; place-items:center; font-size:11px; opacity:0; transform:scale(.4); transition:all .35s cubic-bezier(.3,1.6,.5,1); }
.ag.done .chk { opacity:1; transform:none; }
.core { position:absolute; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; gap:8px; z-index:50; cursor:pointer; }
.core small { font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--fg3); }

/* Tags above the card: every job, the one on screen selected */
.tags { display:flex; gap:6px; margin-bottom:10px; overflow-x:auto; scrollbar-width:none; padding:2px; } .tags::-webkit-scrollbar { display:none; }
.tag { flex:none; display:inline-flex; align-items:center; gap:8px; height:36px; padding:0 13px 0 6px; border-radius:18px; font-size:13px; color:var(--fg2); background:var(--raise2); box-shadow:0 0 0 1px var(--line); transition:background .15s, box-shadow .15s, color .15s; white-space:nowrap; }
.tag:hover { color:var(--fg); box-shadow:0 0 0 1px rgba(240,151,63,.5); }
.tag b { font-weight:600; color:var(--needtx); font-variant-numeric:tabular-nums; }
.tag.need { background:var(--needbg); box-shadow:0 0 0 1px rgba(240,151,63,.3); color:var(--fg); }
.tag.on { background:var(--fg); color:var(--bg); box-shadow:none; } .tag.on b { color:var(--need); }
.tag.done { background:none; color:var(--fg3); } .tag.done b { color:var(--ok); }
.tag.later { background:none; color:var(--fg3); } .tag.later b { color:var(--fg3); font-weight:500; }
.tag.start { background:none; } .tagsep { flex:none; width:1px; margin:8px 2px; background:var(--line); }
/* Orbit or Surface */
.modes { display:inline-flex; gap:2px; padding:3px; border-radius:99px; background:var(--chip); margin-left:12px; }
.modes button { height:28px; padding:0 13px; border-radius:14px; font-size:12.5px; color:var(--fg2); } .modes button.on { background:var(--raise); color:var(--fg); box-shadow:0 1px 2px rgba(0,0,0,.18); }
/* Surface: Cerebro says it in one line, and what needs you comes up as tags */
.surface, .askbox { display:none; }
body[data-mode='surface'] .stage, body[data-mode='surface'] .head, body[data-mode='surface'] .q .tags { display:none; }
body[data-mode='surface'] .surface { display:flex; }
body[data-mode='surface'] .askbox { display:flex; }
body[data-mode='surface'] .q { bottom:104px; }
.surface { position:absolute; left:0; right:0; top:72px; bottom:330px; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:18px; padding:0 40px; z-index:6; }
.sgreet { margin:0; font-weight:400; font-size:clamp(26px, 3.2vw, 42px); letter-spacing:-.03em; line-height:1.15; max-width:820px; }
.sgreet b { font-weight:400; color:var(--need); } .sgreet b.ok { color:var(--ok); }
.stags { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; max-width:1000px; }
.stag { display:inline-flex; align-items:center; gap:10px; height:52px; padding:0 18px 0 8px; border-radius:26px; font-size:16px; color:var(--fg); background:var(--raise2); box-shadow:0 0 0 1px var(--line); opacity:0; transform:translateY(10px) scale(.96); animation:tagIn .5s cubic-bezier(.2,.8,.2,1) forwards; transition:background .2s, box-shadow .2s, color .2s; white-space:nowrap; }
@keyframes tagIn { to { opacity:1; transform:none; } }
.stag b { font-weight:600; color:var(--needtx); font-variant-numeric:tabular-nums; font-size:14px; }
.stag.need { background:var(--needbg); box-shadow:0 0 0 1px rgba(240,151,63,.35), 0 10px 30px -18px rgba(240,151,63,.6); }
.stag.need:hover { box-shadow:0 0 0 1.5px var(--need), 0 14px 34px -16px rgba(240,151,63,.7); transform:translateY(-2px); }
.stag.on { background:var(--fg); color:var(--bg); box-shadow:0 0 0 1.5px var(--need), 0 16px 36px -16px rgba(240,151,63,.75); } .stag.on b { color:var(--need); }
.stag.done { background:none; color:var(--fg3); box-shadow:0 0 0 1px var(--line); } .stag.done b { color:var(--ok); }
.stag.later { background:none; color:var(--fg3); box-shadow:0 0 0 1px dashed var(--line); } .stag.later b { color:var(--fg3); font-weight:500; }
.stag.start { background:none; height:44px; font-size:14.5px; color:var(--fg2); } .stag.start:hover { color:var(--fg); background:var(--hover); }
.sall { display:flex; align-items:center; gap:12px; font-size:17px; color:var(--fg3); min-height:40px; }
.sall .b { height:38px; }
.askbox { position:absolute; left:50%; bottom:32px; transform:translateX(-50%); width:min(560px, calc(100% - 40px)); height:52px; border-radius:26px; background:var(--raise2); box-shadow:0 0 0 1px var(--line), 0 14px 34px -24px rgba(0,0,0,.5); align-items:center; gap:10px; padding:0 7px 0 20px; color:var(--fg3); font-size:15px; z-index:25; }
.askbox span { flex:1; } .askbox kbd { padding:3px 7px; border-radius:7px; background:var(--chip); } .askbox i { width:38px; height:38px; border-radius:50%; background:var(--fg); color:var(--bg); display:grid; place-items:center; font-style:normal; font-weight:600; }
/* The one question on screen */
.q { position:absolute; left:50%; bottom:28px; transform:translateX(-50%); width:min(640px, calc(100% - 40px)); z-index:25; }
.card { border-radius:24px; background:var(--raise2); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); box-shadow:var(--s); padding:18px 20px 16px; transition:transform .4s cubic-bezier(.2,.8,.2,1), opacity .3s; }
.card.need { box-shadow:0 0 0 1.5px rgba(240,151,63,.6), 0 30px 60px -30px rgba(240,151,63,.35); }
.card.out { opacity:0; transform:translateY(12px) scale(.985); }
.meta { display:flex; align-items:center; gap:9px; font-size:12.5px; color:var(--fg3); } .meta b { color:var(--fg2); font-weight:500; }
.meta .stake { margin-left:auto; font-weight:600; padding:3px 10px; border-radius:99px; background:var(--needbg); color:var(--needtx); font-variant-numeric:tabular-nums; }
.meta .stake.good { background:rgba(31,157,92,.14); color:#3ccf86; } :root:not([data-theme='dark']) .meta .stake.good { color:var(--ok); }
.meta .of { font-size:11.5px; color:var(--fg3); margin-left:8px; font-variant-numeric:tabular-nums; }
.say { font-size:clamp(18px, 1.9vw, 23px); letter-spacing:-.018em; line-height:1.34; margin:10px 0 0; }
.say .w { display:inline-block; opacity:0; transform:translateY(5px); filter:blur(3px); animation:wIn .42s cubic-bezier(.2,.8,.2,1) forwards; white-space:pre; }
@keyframes wIn { to { opacity:1; transform:none; filter:none; } }
.say .ctx { color:var(--fg2); }
.more { font-size:14px; color:var(--fg2); max-height:0; overflow:hidden; transition:max-height .35s, margin .35s; margin:0; } .more.open { max-height:90px; margin:8px 0 0; }
.opts { display:flex; flex-wrap:wrap; gap:6px; max-height:0; overflow:hidden; transition:max-height .35s, margin .35s; } .opts.open { max-height:120px; margin:12px 0 0; }
.opts button { height:32px; padding:0 13px; border-radius:16px; font-size:13px; background:var(--chip); color:var(--fg2); } .opts button.on { background:var(--fg); color:var(--bg); }
.acts { display:flex; align-items:center; gap:8px; margin-top:14px; flex-wrap:wrap; } .acts .sp { flex:1; }
.b { height:40px; padding:0 17px; border-radius:20px; font-size:14px; font-weight:500; display:inline-flex; align-items:center; gap:8px; transition:transform .12s; }
.b:active { transform:scale(.97); } .b.p { background:var(--fg); color:var(--bg); } .b.s { background:var(--chip); color:var(--fg); } .b.t { color:var(--fg2); padding:0 8px; font-weight:400; }
.b kbd { border:1px solid currentColor; border-radius:5px; padding:0 4px; opacity:.45; }
.receipt { display:flex; align-items:center; gap:12px; margin-top:12px; } .receipt .ok { width:34px; height:34px; border-radius:50%; background:var(--ok); color:#fff; display:grid; place-items:center; font-size:17px; flex:none; animation:pop .5s cubic-bezier(.3,1.6,.5,1); }
@keyframes pop { from { transform:scale(.3); opacity:0; } }
.receipt p { margin:0; font-size:17px; letter-spacing:-.01em; } .receipt small { display:block; color:var(--fg3); font-size:13px; }
.work { display:flex; align-items:center; gap:12px; font-size:16px; margin-top:12px; } .work .bar2 { flex:1; height:4px; border-radius:2px; background:var(--line); overflow:hidden; } .work .bar2 i { display:block; height:100%; width:0; background:#8b90ff; border-radius:2px; }
.steps { margin:12px 0 0; padding:0; list-style:none; display:flex; flex-direction:column; gap:6px; font-size:14px; color:var(--fg3); }
.steps li { display:flex; align-items:center; gap:9px; } .steps li i { width:16px; height:16px; border-radius:50%; box-shadow:inset 0 0 0 1.5px var(--line); display:grid; place-items:center; font-size:9px; font-style:normal; flex:none; }
.steps li.run { color:var(--fg); } .steps li.run i { box-shadow:inset 0 0 0 1.5px #8b90ff; } .steps li.ok { color:var(--fg2); } .steps li.ok i { background:var(--ok); color:#fff; box-shadow:none; }

/* A place you opened from the sidebar: the real Cerebro V2.2, beside the sidebar */
.pane { position:absolute; inset:0; z-index:35; background:var(--bg); opacity:0; pointer-events:none; transition:opacity .25s; }
.pane.on { opacity:1; pointer-events:auto; } .pane iframe { position:relative; width:100%; height:100%; border:0; display:block; transition:opacity .25s; }
.pane .load { position:absolute; inset:0; display:grid; place-items:center; color:var(--fg3); font-size:13px; pointer-events:none; }

/* Zoom into an agent (from the orbit) */
.zoom { position:absolute; right:16px; top:72px; bottom:16px; width:min(360px, calc(100% - 32px)); z-index:32; border-radius:24px; background:var(--raise2); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); box-shadow:var(--s); padding:18px 14px; display:flex; flex-direction:column; gap:4px; transform:translateX(calc(100% + 40px)); transition:transform .4s cubic-bezier(.2,.8,.2,1); overflow-y:auto; }
.zoom.on { transform:none; }
.dh { display:flex; align-items:center; gap:10px; padding:0 6px 8px; } .dh b { font-size:17px; font-weight:500; } .dh .x { margin-left:auto; width:32px; height:32px; border-radius:50%; background:var(--chip); color:var(--fg2); font-size:13px; display:grid; place-items:center; flex:none; }
.moons { position:relative; height:190px; margin:4px 0; }
.moons .mn { position:absolute; transform:translate(-50%,-50%); display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--fg2); white-space:nowrap; }
.moons .mn i { width:9px; height:9px; border-radius:50%; background:var(--fg3); opacity:.6; } .moons .mn.hot { color:var(--fg); font-weight:500; } .moons .mn.hot i { background:#e0523f; opacity:1; box-shadow:0 0 0 4px rgba(224,82,63,.2); }
.moons .ctr { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); }
.kv { font-size:13.5px; padding:0 6px; } .kv div { display:flex; justify-content:space-between; gap:12px; padding:9px 0; border-top:1px solid var(--line); } .kv span { color:var(--fg3); } .kv b { font-weight:500; text-align:right; }
.skills { display:flex; flex-wrap:wrap; gap:6px; padding:8px 6px; } .skills span { font-size:12px; padding:5px 10px; border-radius:99px; background:var(--chip); color:var(--fg2); }
.dacts { display:flex; gap:8px; padding:8px 6px 0; flex-wrap:wrap; }

/* ⌘K */
.cmd { position:fixed; inset:0; z-index:60; display:none; align-items:flex-start; justify-content:center; padding-top:16vh; background:rgba(0,0,0,.35); }
.cmd.on { display:flex; } .cmd .box { width:min(560px, calc(100vw - 32px)); border-radius:20px; background:var(--raise); box-shadow:var(--s); overflow:hidden; animation:pop .2s ease-out; }

orbiters.forEach((a, i) => {
  const el = document.createElement('div'); el.className = 'ag'; el.dataset.id = a.id
  const fw = document.createElement('div'); fw.className = 'fw'; const cv = makeFace(a, 60, state[a.id])
  fw.append(cv); fw.insertAdjacentHTML('beforeend', `<svg class="prog" viewBox="0 0 50 50"><circle class="bg" cx="25" cy="25" r="22"/><circle class="fg" cx="25" cy="25" r="22" stroke-dasharray="138.2" stroke-dashoffset="138.2"/></svg><span class="chk">✓</span>`)

})

const K = 0.6 // how tall the orbit is (1 = a circle)
function geo() {
  const w = main.clientWidth, h = main.clientHeight
  const top = 150, bottom = h - 250
  const cx = w / 2, cy = (top + bottom) / 2 + 8
  const R = Math.max(110, Math.min(w * 0.4, ((bottom - top) / 2 - 36) / K, 440))
  return { cx, cy, R }
}
let last = performance.now()
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t
  if (S.place === 'now') {
    const { cx, cy, R } = geo(), j = cur(), n = j && S.phase === 'ask' ? nodes[j.agent] : null
    rings.innerHTML = `<ellipse class="g1" cx="${cx}" cy="${cy}" rx="${R * RING.need}" ry="${R * RING.need * K}"/>` + [RING.need, RING.work, RING.idle].map((f, i) => `<ellipse class="r${i + 1}" cx="${cx}" cy="${cy}" rx="${R * f}" ry="${R * f * K}"/>`).join('') + (n?.x ? `<path class="tether" d="M${n.x} ${n.y} Q${(cx + n.x) / 2} ${(cy + n.y) / 2 - 40} ${cx} ${cy}"/>` : '')
    lbls.forEach((l, i) => { const f = [RING.need, RING.work, RING.idle][i]; l.style.left = cx + 'px'; l.style.top = cy - R * f * K + 'px' })
    core.style.left = cx + 'px'; core.style.top = cy + 'px'
    for (const a of orbiters) {
      const o = nodes[a.id], st = state[a.id]
      o.r += ((RING[st] ?? 1) - o.r) * Math.min(1, dt * 2.2)
      o.ang += o.spd * dt * (st === 'need' ? 0.5 : 1)
      const x = cx + Math.cos(o.ang) * R * o.r, y = cy + Math.sin(o.ang) * R * o.r * K
      const depth = (Math.sin(o.ang) + 1) / 2, sc2 = (0.76 + depth * 0.32) * (st === 'need' ? 1.18 : 1)
      o.el.style.transform = `translate(${x}px, ${y}px) translate(-50%, -50%) scale(${sc2})`
      o.el.style.zIndex = Math.round(depth * 100) + (Math.sin(o.ang) > 0 ? 60 : 0)
      o.el.style.opacity = st === 'need' ? 1 : 0.45 + depth * 0.55
      o.x = x; o.y = y; o.f.state = st === 'done' ? 'idle' : st
      o.el.classList.toggle('need', st === 'need'); o.el.classList.toggle('work', st === 'work'); o.el.classList.toggle('done', st === 'done')
      if (prog[a.id] != null) o.el.querySelector('.prog .fg').setAttribute('stroke-dashoffset', 138.2 * (1 - prog[a.id]))
    }
  }
  requestAnimationFrame(frame)
}

function yes() {
  const j = cur(); if (!j || S.phase !== 'ask' || S.place !== 'now') return
  stopVoice(); S.phase = 'work'; S.list = S.list.filter((x) => x !== j)
  state[j.agent] = 'work'; prog[j.agent] = 0; render()
  const T = 700 * j.steps.length + 500; let t0 = 0

    const t = performance.now(); if (!t0) t0 = t

    if (p < 1) return setTimeout(run, 40)
    state[j.agent] = 'done'; delete prog[j.agent]; S.done.push(j.id); S.phase = 'receipt'; lastDone = j.id

  }

}

}

}
cmdIn.addEventListener('input', () => { hi = 0; drawCmd() })
cmdRs.addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; cmd.classList.remove('on'); if (b.dataset.i) CMDS()[+b.dataset.i].go(); else go('new') })
cmd.addEventListener('click', (e) => { if (e.target === cmd) cmd.classList.remove('on') })
cmdIn.addEventListener('keydown', (e) => {
  const bs = [...cmdRs.querySelectorAll('button')]
  if (e.key === 'ArrowDown') { hi = Math.min(bs.length - 1, hi + 1); drawCmd(); e.preventDefault() } else if (e.key === 'ArrowUp') { hi = Math.max(0, hi - 1); drawCmd(); e.preventDefault() }
  else if (e.key === 'Enter') bs[hi]?.click(); else if (e.key === 'Escape') cmd.classList.remove('on')
})
document.getElementById('searchBtn').addEventListener('click', openCmd)

// ═══ Talk: V2.2's recorded voice ═══
let audio = null
function stopVoice() { if (audio) { audio.pause(); audio = null } coreFace._f.state = 'idle' }
function play(name, then) {
  if (audio) audio.pause()
  audio = new Audio(`../audio/${name}.m4a`); coreFace._f.state = 'talk'
  audio.onended = () => { coreFace._f.state = 'idle'; then?.() }; audio.onerror = () => { coreFace._f.state = 'idle'; then?.() }
  audio.play().catch(() => (coreFace._f.state = 'idle'))
}
function speak(j) { play(`g-${j.audio}-say`, () => S.talk && cur() === j && S.phase === 'ask' && play(`g-${j.audio}-ask`)) }
function toggleTalk() { S.talk = !S.talk; document.getElementById('talkBtn').classList.toggle('on', S.talk); if (S.talk && S.phase === 'ask' && S.place === 'now') speak(cur()); else stopVoice() }
document.getElementById('talkBtn').addEventListener('click', toggleTalk)

// ═══ Bits ═══
let toastT = 0, undoFn = null
function toast(t, u) { const el = document.getElementById('toast'); document.getElementById('toastT').textContent = t; undoFn = u; document.getElementById('toastU').style.display = u ? '' : 'none'; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 3200) }
document.getElementById('toastU').addEventListener('click', () => { undoFn?.(); undoFn = null; document.getElementById('toast').classList.remove('on') })
function theme(t) { document.documentElement.dataset.theme = t; try { localStorage.setItem('presence-theme2', t) } catch {} ; if (S.place !== 'now') go(S.place) }
document.getElementById('themeBtn').addEventListener('click', () => theme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'))
try { document.documentElement.dataset.theme = localStorage.getItem('presence-theme2') || 'dark' } catch {}
addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); return openCmd() }
  if (cmd.classList.contains('on') || e.metaKey || e.ctrlKey || e.altKey) return
  if (e.key === 'Escape') { if (S.zoom) return closeZoom(); if (S.place !== 'now') return goNow() }
  if (S.place !== 'now') return
  const k = e.key.toLowerCase()
  if (k === 'y') yes(); else if (k === 'n') later(); else if (k === 'enter') next(); else if (k === 't') toggleTalk(); else if (k === 'd') document.getElementById('themeBtn').click()
  else if (k === 'c' && S.phase === 'ask') card.querySelector('[data-k="change"]')?.click()
})
// ═══ Surface: one line from Cerebro, the jobs as tags ═══
const surf = { face: document.getElementById('sface'), greet: document.getElementById('sgreet'), tags: document.getElementById('stags'), all: document.getElementById('sall') }
surf.face.append(makeFace(ag('cerebro'), 92))
let lastSig = ''
function drawSurface() {
  const n = needN(), W = ['No', 'One', 'Two', 'Three'], on = S.phase !== 'clear' ? S.job : null
  surf.greet.innerHTML = n ? `Morning, Karthik. <b>${W[n] ?? n} thing${n === 1 ? '' : 's'}</b> need${n === 1 ? 's' : ''} you.` : `<b class="ok">All clear,</b> Karthik.${backTotal() ? ` $${backTotal().toFixed(1)}k a month is back.` : ''}`
  // tags only animate in when the set changes, not on every click
  const sig = JOBS.map((j) => j.id + (S.done.includes(j.id) ? 'd' : S.later.includes(j) ? 'l' : '')).join() + STARTS.map((j) => (S.done.includes(j.id) ? 'd' : '')).join()
  const fresh = sig !== lastSig; lastSig = sig
  const tag = (j, cls, right, i) => `<button class="stag ${cls}${j === on ? ' on' : ''}" data-tag="${j.id}" style="${fresh ? `animation-delay:${0.08 + i * 0.07}s` : 'animation:none;opacity:1;transform:none'}"><span class="mf" data-agent="${j.agent}"></span>${j.title}${right ? ` <b>${right}</b>` : ''}</button>`
  const needs = JOBS.map((j, i) => (S.done.includes(j.id) ? tag(j, 'done', '✓', i) : S.later.includes(j) ? tag(j, 'later', 'Later', i) : tag(j, 'need', j.stake.replace('/mo', '').replace(' missed', ''), i))).join('')
  const starts = STARTS.map((j, i) => tag(j, S.done.includes(j.id) ? 'done' : 'start', S.done.includes(j.id) ? '✓' : '', JOBS.length + i)).join('')
  surf.tags.innerHTML = needs + `<span style="flex-basis:100%;height:0"></span>` + starts
  surf.tags.querySelectorAll('.mf').forEach((m) => { const id = m.closest('[data-tag]').dataset.tag, j = ALLJ.find((x) => x.id === id), hot = JOBS.includes(j) && !S.done.includes(id) && !S.later.includes(j); m.replaceWith(makeFace(ag(m.dataset.agent), hot ? 36 : 28, hot ? 'need' : 'idle')) })
  surf.all.innerHTML = n > 1 && S.phase === 'ask' && !S.auto ? `Want me to take all ${W[n]?.toLowerCase() ?? n}? <button class="b p" data-all>Take all ${n}</button>` : S.auto ? 'Working through them one by one…' : ''
}
surf.tags.addEventListener('click', (e) => {
  const t = e.target.closest('[data-tag]'); if (!t || S.phase === 'work') return
  const j = ALLJ.find((x) => x.id === t.dataset.tag)
  if (S.done.includes(j.id)) return go(j.id)
  S.later = S.later.filter((x) => x !== j); S.list = [j, ...S.list.filter((x) => x !== j)]; show(j)
})
surf.all.addEventListener('click', (e) => { if (!e.target.closest('[data-all]')) return; S.auto = true; const nx = JOBS.find((j) => !S.done.includes(j.id) && !S.later.includes(j)); if (nx) { S.list = [nx, ...S.list.filter((x) => x !== nx)]; show(nx); setTimeout(yes, 600) } })
document.getElementById('askbox').addEventListener('click', openCmd)
// Orbit or Surface, remembered
function setMode(m) { S.mode = m; document.body.dataset.mode = m; document.querySelectorAll('#modes button').forEach((b) => b.classList.toggle('on', b.dataset.mode === m)); try { localStorage.setItem('presence-mode', m) } catch {} }
document.getElementById('modes').addEventListener('click', (e) => { const b = e.target.closest('[data-mode]'); if (b) { if (S.place !== 'now') goNow(); setMode(b.dataset.mode) } })
try { setMode(localStorage.getItem('presence-mode') || 'orbit') } catch { setMode('orbit') }
render(false)
</script>
</body></html>
